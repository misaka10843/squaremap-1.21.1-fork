name: Build NeoForge 1.21.1
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build NeoForge jar
        run: |
          chmod +x gradlew
          ./gradlew :squaremap-neoforge:build
      - name: Upload NeoForge artifact
        uses: actions/upload-artifact@v4
        with:
          name: squaremap-neoforge-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
